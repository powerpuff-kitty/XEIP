name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts --no-audit
      - run: npm run check:js
      - run: npm run validate:fixtures
      - run: npm run typecheck
      - run: npm run typecheck:relay
      - run: npm run typecheck:identity
      - run: npm run build:ts
      - run: npm run typecheck:organization
      - run: npm run typecheck:console
      - run: npm run test:organization
      - run: npm test
      - name: Coverage (gated)
        run: npm run coverage
      - run: npm run test:ts
      - run: npm run demo:admission
      - run: npm run demo:replay
      - run: npm run demo:delivery
      - run: npm run demo:receipts
      - run: npm run demo:durable
      - run: npm run demo:limits
      - run: npm run demo:signatures
      - run: npm run demo:keydoc
      - name: Run end-to-end local demo
        shell: bash
        run: |
          XEIP_DEV_TOKEN="$(openssl rand -hex 24)"
          export XEIP_DEV_TOKEN
          node services/relay/server.mjs &
          relay_pid=$!
          trap 'kill "$relay_pid" 2>/dev/null || true' EXIT
          for _ in {1..40}; do
            if curl --fail --silent http://127.0.0.1:8787/health >/dev/null; then break; fi
            sleep 0.2
          done
          npm run demo
  organization-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts --no-audit
      - run: npm run build:ts
      - run: docker pull quay.io/keycloak/keycloak:26.8.0@sha256:27b3230fbabb8c9ff3c66c864cf09dcd8a41aca82e5100679d109ef0eeb05741
      - run: docker pull postgres:18.6-alpine@sha256:77f585114c32fbca283dc835b0596f4e52b51b4c6662d7810b2f4084f60a1873
      - run: npm run test:organization:integration
  postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts --no-audit
      - run: npm run build:ts
      - run: docker pull postgres:18.6-alpine@sha256:77f585114c32fbca283dc835b0596f4e52b51b4c6662d7810b2f4084f60a1873
      - run: npm run coverage:organization
      - run: npm run test:postgres:replication
      - run: npm run test:postgres:control
      - run: npm run test:postgres:trust
      - run: npm run test:postgres:fence
      - run: npm run test:postgres:lease
      - run: npm run test:postgres:owner
      - run: npm run test:postgres:archive-recovery
      - run: node conformance/organization-disk-full.mjs
      - run: node conformance/organization-wal-full.mjs
      - run: node conformance/organization-corruption.mjs
  organization-artifact:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - run: docker build --platform linux/amd64 --file deploy/organization.Dockerfile --tag xeip-organization:local-review .
      - run: node conformance/organization-artifact.mjs
      - name: Scan exact Linux runtime image (High/Critical gate)
        id: image_scan
        run: bash conformance/organization-image-scan.sh xeip-organization:local-review "${RUNNER_TEMP}/xeip-image-scan"
      - name: Retain image scan evidence, including failures
        if: ${{ always() && (steps.image_scan.outcome == 'success' || steps.image_scan.outcome == 'failure' || steps.image_scan.outcome == 'cancelled') }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: organization-image-scan
          path: |
            ${{ runner.temp }}/xeip-image-scan/*.json
            ${{ runner.temp }}/xeip-image-scan/*.log
            ${{ runner.temp }}/xeip-image-scan/*.txt
          if-no-files-found: error
          retention-days: 14
  organization-console:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts --no-audit
      - run: npm run build:console
      - run: npm run typecheck:console
      - run: npx playwright install --with-deps chromium
      - run: npm run test:console:browser
      - run: docker pull quay.io/keycloak/keycloak:26.8.0@sha256:27b3230fbabb8c9ff3c66c864cf09dcd8a41aca82e5100679d109ef0eeb05741
      - run: docker pull postgres:18.6-alpine@sha256:77f585114c32fbca283dc835b0596f4e52b51b4c6662d7810b2f4084f60a1873
      - run: npm run test:console:keycloak
  cloudflare-ledger:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts --no-audit
      - run: npm run test:cloudflare
      - run: npm run typecheck:cloudflare
  cloudflare-keycloak:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts --no-audit
      - run: npm run test:cloudflare:keycloak
  rust-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          toolchain: '1.94.1'
          components: rustfmt, clippy
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
  rust:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        rust: ['1.81.0', '1.94.1']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          toolchain: ${{ matrix.rust }}
      - run: cargo test --workspace --all-targets --locked
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts --no-audit
      - run: npm run test:interop
  supply-chain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2
        with:
          command: check advisories licenses sources bans
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts
      - run: npm audit --audit-level=high
