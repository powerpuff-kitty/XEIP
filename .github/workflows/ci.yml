name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts --no-audit
      - run: node --check examples/local-relay/console.js
      - run: npm run validate:fixtures
      - run: npm run typecheck
      - run: npm run build:ts
      - run: npm test
      - run: npm run test:ts
      - run: npm run demo:admission
      - run: npm run demo:replay
      - run: npm run demo:delivery
      - name: Run end-to-end local demo
        shell: bash
        run: |
          export XEIP_DEV_TOKEN="$(openssl rand -hex 24)"
          node services/relay/server.mjs &
          relay_pid=$!
          trap 'kill "$relay_pid" 2>/dev/null || true' EXIT
          for n in {1..40}; do
            if curl --fail --silent http://127.0.0.1:8787/health >/dev/null; then break; fi
            sleep 0.2
          done
          npm run demo
  rust-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.94.1'
          components: rustfmt, clippy
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
  rust:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        rust: ['1.81.0', '1.94.1']
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ matrix.rust }}
      - run: cargo test --workspace --all-targets --locked
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts --no-audit
      - run: npm run test:interop
